<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel do Professor - Área Restrita</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; padding: 0; }
        
        #lock-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(-45deg, #4b0082, #8a2be2, #240b36, #c71585);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .login-box {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            text-align: center;
            width: 320px;
        }

        /* Layout do Painel */
        .container { max-width: 1100px; margin: auto; padding: 20px; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); margin-bottom: 25px; }
        h1 { color: #4b0082; margin: 0; font-size: 1.8rem; }
        
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #ddd; padding-bottom: 10px; }
        .tab-btn { padding: 12px 25px; cursor: pointer; border: none; background: #e0e0e0; border-radius: 8px; font-weight: bold; transition: 0.3s; }
        .tab-btn.active { background: #4b0082; color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .container-logos-internos {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #f0f0f0;
        }

        .logo-interna { height: 55px; width: auto; object-fit: contain; }

        /* Estilos de Tabela e Grid */
        .dashboard-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .stat-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); text-align: center; border-top: 4px solid #4b0082; }
        .btn-principal { background: #4b0082; color: white; padding: 15px; border: none; border-radius: 6px; width: 100%; cursor: pointer; font-weight: bold; margin-top: 10px; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 10px; box-sizing: border-box; }
        
        .hidden-content { display: none; }
        .turma-card-gestao { background: #fff; border: 1px solid #e0e0e0; border-radius: 12px; margin-bottom: 25px; overflow: hidden; }
        .turma-header-gestao { background: #f8f9fa; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #4b0082; }
        .tabela-alunos-gestao { width: 100%; border-collapse: collapse; }
        .tabela-alunos-gestao th, .tabela-alunos-gestao td { padding: 12px; border-bottom: 1px solid #eee; text-align: center; }
    </style>
</head>
<body>

<div id="lock-screen">
    <div class="login-box">
        <div class="icon-lock">🔐</div>
        <h2>Acesso Restrito</h2>
        <p>Área exclusiva do Professor</p>
        <input type="password" id="inputSenha" onkeyup="verificarSenha(event)" placeholder="Digite sua senha">
        <p id="erroSenha" style="color:red; display:none;">⚠️ Senha incorreta.</p>
    </div>
</div>

<div id="conteudo-painel" class="hidden-content">
    <div class="container">
        <div class="card">
            <div class="container-logos-internos">
                <img src="tecla.png" alt="Centro Social" class="logo-interna">
                <h1>👨‍🏫 Painel do Professor</h1>
                <img src="paulinas.png" alt="Paulinas" class="logo-interna">
            </div>

            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab(event, 'tab-pontos')">Lançar Pontos</button>
                <button class="tab-btn" onclick="switchTab(event, 'tab-cadastro')">Novos Cadastros</button>
                <button class="tab-btn" onclick="switchTab(event, 'tab-gestao')">Gestão de Dados</button>
            </div>

            <div id="tab-pontos" class="tab-content active">
                <div class="card">
                    <h2>🎯 Lançamento Individual</h2>
                    <select id="selTurmaPonto" onchange="carregarAlunosParaPonto(this.value)"><option value="">Carregando turmas...</option></select>
                    <select id="selAlunoPonto"><option value="">Selecione a turma...</option></select>
                    <button class="btn-principal" onclick="handleLancarIndividual()">Confirmar Pontos</button>
                </div>
            </div>

            <div id="tab-cadastro" class="tab-content">
                <div class="card">
                    <h2>Nova Turma</h2>
                    <input type="text" id="nomeTurma" placeholder="Nome da Turma">
                    <input type="number" id="metaTurma" placeholder="Meta de XP Mensal">
                    <button class="btn-principal" onclick="handleNovaTurma()">Criar Turma</button>
                </div>
                <div class="card">
                    <h2>Novo Aluno</h2>
                    <input type="text" id="nomeAluno" placeholder="Nome do Aluno">
                    <select id="selTurmaCadastro"><option value="">Selecione a turma...</option></select>
                    <button class="btn-principal" onclick="handleNovoAluno()">Cadastrar Aluno</button>
                </div>
            </div>

            <div id="tab-gestao" class="tab-content">
                <div id="statsContainer" class="dashboard-stats"></div>
                <div id="listaGestao"></div>
            </div>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

<script>
    // Configuração Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyCokj8lu7OEwynnteAT3iObnz8qbV1Hvwk",
        authDomain: "centro-social-tecla-merlo.firebaseapp.com",
        projectId: "centro-social-tecla-merlo",
        storageBucket: "centro-social-tecla-merlo.firebasestorage.app",
        messagingSenderId: "653126314182",
        appId: "1:653126314182:web:8769015d8e5b3764aa4fc7"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // --- FUNÇÕES DE SEGURANÇA ---
    function verificarSenha(event) {
        if (event.key === "Enter") {
            const senha = document.getElementById('inputSenha').value;
            if (senha === "192837") { 
                document.getElementById('lock-screen').style.display = 'none';
                document.getElementById('conteudo-painel').classList.remove('hidden-content');
                init();
            } else {
                document.getElementById('erroSenha').style.display = 'block';
            }
        }
    }

    function switchTab(evt, tabId) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        evt.currentTarget.classList.add('active');
        if(tabId === 'tab-gestao') carregarGestao();
    }

    // --- LÓGICA DE DADOS ---
    async function init() {
        const snapshot = await db.collection("turmas").orderBy("nome").get();
        const turmas = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        
        ['selTurmaPonto', 'selTurmaCadastro'].forEach(id => {
            const el = document.getElementById(id);
            el.innerHTML = '<option value="">Selecione...</option>';
            turmas.forEach(t => el.innerHTML += `<option value="${t.id}">${t.nome}</option>`);
        });
    }

    async function handleNovaTurma() {
        const nome = document.getElementById('nomeTurma').value;
        const meta = parseInt(document.getElementById('metaTurma').value);
        if(!nome || !meta) return alert("Preencha tudo!");

        try {
            await db.collection("turmas").add({ nome, metaMensal: meta });
            alert("Turma criada com sucesso!");
            document.getElementById('nomeTurma').value = "";
            document.getElementById('metaTurma').value = "";
            init();
        } catch (e) { alert("Erro ao cadastrar"); }
    }

    async function handleNovoAluno() {
        const nome = document.getElementById('nomeAluno').value;
        const turmaId = document.getElementById('selTurmaCadastro').value;
        if(!nome || !turmaId) return alert("Preencha tudo!");

        try {
            await db.collection("alunos").add({
                nome,
                turmaId,
                xpTotal: 0,
                xpMissoes: 0,
                xpExtra: 0,
                xpPenalidade: 0
            });
            alert("Aluno cadastrado!");
            document.getElementById('nomeAluno').value = "";
        } catch (e) { alert("Erro ao cadastrar"); }
    }

    async function carregarAlunosParaPonto(tid) {
        const sel = document.getElementById('selAlunoPonto');
        if(!tid) return;
        const snapshot = await db.collection("alunos").where("turmaId", "==", tid).get();
        sel.innerHTML = '<option value="">Selecione o aluno...</option>';
        snapshot.forEach(doc => sel.innerHTML += `<option value="${doc.id}">${doc.data().nome}</option>`);
    }

    // Se as funções estiverem em gamificacao.js, garanta que os nomes coincidam.
</script>
</body>
</html>
